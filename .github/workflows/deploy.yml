# =============================================================================
# CaiGouPetService — GitHub Actions CI/CD 工作流
#
# 触发方式:
#   - push 到 main / master        → CI（编译 + 构建镜像 + 推送到阿里云 ACR）+ 部署
#   - pull_request 到 main / master → 仅 CI（编译）
#
# 部署原理:
#   CI 在 GitHub 托管 runner 上编译代码、构建 Docker 镜像、推送到阿里云 ACR (北京).
#   自托管 runner 在 ECS 上从阿里云 ACR 拉取镜像后启动容器.
#   ECS 也在北京区域，走内网拉取，速度极快.
#
# 前置条件 (云服务器上执行一次):
#   1. 安装 Docker + docker-compose 插件（已装好）
#   2. 安装 git（已装好）
#   3. 在 GitHub Secrets 中配置 ACR 登录信息 + DB_PASS / DB_USER / JWT_SECRET
#   4. 服务器上先 docker login 到 ACR（或由 workflow 自动登录）
# =============================================================================

name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 支持在 Actions 页面手动触发部署
  workflow_dispatch:

env:
  # 阿里云 ACR 配置（北京区域）
  ACR_REGISTRY: crpi-da59qcl73m93max2.cn-beijing.personal.cr.aliyuncs.com
  ACR_NAMESPACE: caigoupet
  IMAGE_NAME: caigou-pet-service
  # 完整的镜像地址
  IMAGE_URI: crpi-da59qcl73m93max2.cn-beijing.personal.cr.aliyuncs.com/caigoupet/caigou-pet-service

jobs:
  # ===========================================================================
  # 任务 1: CI — 编译打包 + 构建并推送 Docker 镜像到 ACR
  # ===========================================================================
  ci:
    name: CI — 编译 + 推送镜像到 ACR
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21（Temurin）
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 编译打包（跳过测试）
        # CI 环境无 MySQL 数据库可连，只编译打包
        # 集成测试在本地开发环境运行，部署后靠 /actuator/health 验证
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送 Docker 镜像到 ACR
        run: |
          # 生成镜像标签：latest + 短 commit SHA
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          # 构建镜像
          docker build -t "${IMAGE_URI}:latest" -t "${IMAGE_URI}:${SHORT_SHA}" .

          # 推送到阿里云 ACR（走公网，但 ECS 拉取时走内网）
          docker push "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${SHORT_SHA}"

          echo "镜像已推送: ${IMAGE_URI}:latest"

  # ===========================================================================
  # 任务 2: 部署 — 云服务器自托管 runner 执行
  # ===========================================================================
  deploy:
    name: 部署到云服务器
    runs-on: self-hosted
    needs: ci
    # 分支级 push 或手动触发才部署，PR 不部署
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    # 所需 GitHub Secrets:
    #   ACR_USERNAME    阿里云 ACR 登录用户名（账号全名）
    #   ACR_PASSWORD    阿里云 ACR 登录密码
    #   DB_PASS         数据库密码
    #   DB_USER         数据库用户名（默认 dev_user）
    #   JWT_SECRET      JWT 签名密钥
    #   APP_DIR         可选，服务器上项目目录，默认 /opt/CaiGouPetService
    # ------------------------------------------------------------------
    env:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_USER: ${{ secrets.DB_USER }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_DIR: ${{ secrets.APP_DIR || '/opt/CaiGouPetService' }}

    steps:
      - name: 登录 ACR 并启动服务
        run: |
          set -e
          echo "=========================================="
          echo "开始部署: $APP_DIR (${{ github.ref_name }}@${{ github.sha }})"
          echo "=========================================="

          # 确保项目目录存在
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"

          # 确保数据目录存在
          mkdir -p uploads logs

          # 写入 docker-compose.yml（直接从 workflow 模板生成，不依赖网络拉取代码）
          cat > docker-compose.yml << 'DOCKERCOMPOSE'
          services:
            app:
              image: crpi-da59qcl73m93max2.cn-beijing.personal.cr.aliyuncs.com/caigoupet/caigou-pet-service:latest
              ports:
                - "${PORT:-3000}:${PORT:-3000}"
                - "${SOCKET_PORT:-3001}:${SOCKET_PORT:-3001}"
              environment:
                PORT: ${PORT:-3000}
                DB_URL: ${DB_URL:-jdbc:mysql://47.94.240.159:3306/caigoupet?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
                DB_USER: ${DB_USER:-root}
                DB_PASS: ${DB_PASS:?DB_PASS must be set}
                JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
                JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
                UPLOAD_DIR: /app/uploads
                LOG_PATH: /app/logs
                LOG_LEVEL: ${LOG_LEVEL:-INFO}
                SOCKET_ENABLED: ${SOCKET_ENABLED:-true}
                CAIGOPET_SOCKET_HOST: 0.0.0.0
                CAIGOPET_SOCKET_PORT: ${SOCKET_PORT:-3001}
              volumes:
                - ./uploads:/app/uploads
                - ./logs:/app/logs
              restart: unless-stopped
          DOCKERCOMPOSE

          # 登录公网 ACR，必须与 docker-compose.yml 中的镜像域名完全一致
          # VPC 地址和公网地址是两个不同的 Docker Registry 主机，凭据不能混用
          echo "登录阿里云 ACR..."
          echo "${ACR_PASSWORD}" | docker login \
            --username="${ACR_USERNAME}" \
            --password-stdin \
            crpi-da59qcl73m93max2.cn-beijing.personal.cr.aliyuncs.com

          # 创建 .env
          cat > .env << EOF
          PORT=3000
          DB_URL=jdbc:mysql://47.94.240.159:3306/caigoupet?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          DB_USER="${DB_USER}"
          DB_PASS="${DB_PASS}"
          JWT_SECRET="${JWT_SECRET}"
          JWT_EXPIRES_IN=7d
          LOG_LEVEL=INFO
          EOF

          # 从 ACR 拉取最新镜像并启动
          docker compose pull
          docker compose down --remove-orphans
          docker compose up -d --force-recreate

          # 清理旧镜像
          docker image prune -f >/dev/null 2>&1 || true

          # 健康检查
          echo "等待服务启动..."
          for i in $(seq 1 12); do
            sleep 5
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://localhost:${{ vars.APP_PORT || '3000' }}/actuator/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "部署成功: 健康检查通过 (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "  尝试 $i/12: HTTP $HTTP_CODE"
          done

          echo "警告: 健康检查超时，请查看容器日志: docker compose logs"
          exit 1

  # ===========================================================================
  # 任务 3: 部署结果通知
  # ===========================================================================
  notify:
    name: 部署结果通知
    runs-on: ubuntu-22.04
    needs: deploy
    if: always() && needs.deploy.result != 'skipped'

    steps:
      - name: 打印部署状态
        run: |
          echo "部署状态: ${{ needs.deploy.result }}"
          echo "详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"