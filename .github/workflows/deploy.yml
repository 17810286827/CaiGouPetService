# =============================================================================
# CaiGouPetService — GitHub Actions CI/CD 工作流
#
# 触发方式:
#   - push 到 main / master        → 完整 CI（GitHub 托管 runner 编译）+ 部署（自托管 runner 执行）
#   - pull_request 到 main / master → 仅 CI（编译）
#
# 部署原理:
#   在云服务器上安装 GitHub Actions 自托管 runner, 提交代码后 runner 自动触发,
#   在服务器本地执行 git pull + docker compose up --build, 不走 SSH.
#   不受海外 runner 网络超时限制, 无需 Docker Hub 账号.
#
# 前置条件 (云服务器上执行一次):
#   1. 安装 Docker 与 docker-compose 插件
#   2. 安装 GitHub Actions 自托管 runner (详见 README)
#   3. 在 GitHub Secrets 中配置 DB_PASS / JWT_SECRET
# =============================================================================

name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 支持在 Actions 页面手动触发部署
  workflow_dispatch:

jobs:
  # ===========================================================================
  # 任务 1: CI — 编译 (PR 与 push 都会执行)
  # ===========================================================================
  ci:
    name: CI — 编译
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21（Temurin）
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 编译（跳过测试，测试需连接真实数据库，不在 CI 环境运行）
        # CI 环境无 MySQL 数据库可连，此处只编译验证代码语法
        # 集成测试在本地开发环境运行，部署后靠 /actuator/health 验证
        run: |
          chmod +x mvnw
          ./mvnw -B clean compile

  # ===========================================================================
  # 任务 2: 部署 — 云服务器自托管 runner 执行, 依赖 CI 先通过
  # ===========================================================================
  deploy:
    name: 部署到云服务器
    # 使用安装在云服务器上的自托管 runner, 在服务器本地执行部署脚本
    # 无需 SSH 免密, 不受海外 runner 网络超时限制
    runs-on: self-hosted
    needs: ci
    # 分支级 push 或手动触发才部署, PR 不部署
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    # 所需 GitHub Secrets:
    #   DB_PASS      数据库密码 (云上 MySQL, 对应 .env 的 DB_PASS)
    #   JWT_SECRET   JWT 签名密钥
    #   APP_DIR      可选, 服务器上项目目录, 默认 /opt/CaiGouPetService
    # ------------------------------------------------------------------
    env:
      # 从 Secrets 读取敏感配置, 注入到部署脚本
      DB_PASS: ${{ secrets.DB_PASS }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_DIR: ${{ secrets.APP_DIR || '/opt/CaiGouPetService' }}

    steps:
      # 自托管 runner 不需要 actions/checkout, 手动 git pull 可控性更强
      - name: 拉取最新代码并重启 Docker 服务
        run: |
          set -e
          echo "=========================================="
          echo "开始部署: $APP_DIR (${{ github.ref_name }}@${{ github.sha }})"
          echo "=========================================="

          # 首次部署时自动克隆仓库
          if [ ! -d "$APP_DIR/.git" ]; then
            echo "首次部署: 克隆仓库"
            mkdir -p "$(dirname "$APP_DIR")"
            git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
          fi

          cd "$APP_DIR"

          # 拉取最新代码
          git fetch --prune origin
          git checkout "${{ github.ref_name }}"
          git pull --ff-only origin "${{ github.ref_name }}"

          # 创建 .env (来自仓库 .env.example; 真实密钥由 GitHub Secrets 注入)
          # .env 已在 .gitignore 中, 不会污染工作区
          if [ ! -f .env ]; then
            echo "首次部署: 从 .env.example 生成 .env"
            cp .env.example .env
          fi
          # 覆写敏感密钥: 先删除旧行再追加, 避免 sed 分隔符与特殊字符冲突
          grep -v '^DB_PASS=' .env > .env.tmp || true
          echo "DB_PASS=\"${DB_PASS}\"" >> .env.tmp
          grep -v '^JWT_SECRET=' .env.tmp > .env.tmp2
          echo "JWT_SECRET=\"${JWT_SECRET}\"" >> .env.tmp2
          mv .env.tmp2 .env

          # 使用代码库中的 docker-compose.yml 重新构建并启动
          docker compose down --remove-orphans
          docker compose up -d --build --force-recreate

          # 清理悬空镜像与构建缓存, 防止磁盘被占满
          docker image prune -f >/dev/null 2>&1 || true
          docker builder prune -f >/dev/null 2>&1 || true

          # 健康检查: 依赖 Actuator 的 /actuator/health
          echo "等待服务启动..."
          sleep 8
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 3 --retry-connrefused \
            "http://localhost:${{ vars.APP_PORT || '3000' }}/actuator/health" || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "部署成功: 健康检查通过 (HTTP $HTTP_CODE)"
          else
            echo "警告: 健康检查返回 HTTP $HTTP_CODE, 请查看容器日志: docker compose logs"
            exit 1
          fi

  # ===========================================================================
  # 任务 3: 部署结果通知 (可选, 需要配置通知渠道)
  # ===========================================================================
  notify:
    name: 部署结果通知
    runs-on: ubuntu-22.04
    needs: deploy
    if: always() && needs.deploy.result != 'skipped'

    steps:
      - name: 打印部署状态
        run: |
          echo "部署状态: ${{ needs.deploy.result }}"
          echo "详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"