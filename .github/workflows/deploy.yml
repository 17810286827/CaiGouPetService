# =============================================================================
# CaiGouPetService — GitHub Actions CI/CD 工作流
#
# 触发方式:
#   - push 到 main / master        → 完整 CI（编译 + 构建 Docker 镜像）+ 部署（自托管 runner 执行）
#   - pull_request 到 main / master → 仅 CI（编译）
#
# 部署原理:
#   CI 在 GitHub 托管 runner 上编译代码, 构建 Docker 镜像, 打包为 tar 上传 artifact.
#   自托管 runner 在云服务器本地下载镜像 tar, 用 docker load 导入, 然后 docker compose up.
#   服务器无需从 Docker Hub 拉取 base 镜像, 不受镜像源慢的限制.
#
# 前置条件 (云服务器上执行一次):
#   1. 安装 Docker + docker-compose 插件（已装好）
#   2. 安装 git（已装好）
#   3. 创建 /opt/CaiGouPetService 目录并授权给 runner 用户（已做）
#   4. 在 GitHub Secrets 中配置 DB_PASS / JWT_SECRET
# =============================================================================

name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 支持在 Actions 页面手动触发部署
  workflow_dispatch:

jobs:
  # ===========================================================================
  # 任务 1: CI — 编译打包 + 构建 Docker 镜像
  # ===========================================================================
  ci:
    name: CI — 编译 + Docker 构建
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21（Temurin）
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 编译打包（跳过测试）
        # CI 环境无 MySQL 数据库可连, 只编译打包
        # 集成测试在本地开发环境运行, 部署后靠 /actuator/health 验证
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: 设置 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: caigou-pet-service
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: 构建 Docker 镜像
        run: |
          docker build -t caigou-pet-service:latest .
          # 保存镜像为 tar 文件（压缩以减小体积）
          docker save caigou-pet-service:latest | gzip > caigou-pet-service.tar.gz

      - name: 上传 Docker 镜像为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: caigou-pet-service.tar.gz
          retention-days: 1

  # ===========================================================================
  # 任务 2: 部署 — 云服务器自托管 runner 执行
  # ===========================================================================
  deploy:
    name: 部署到云服务器
    runs-on: self-hosted
    needs: ci
    # 分支级 push 或手动触发才部署, PR 不部署
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    # 所需 GitHub Secrets:
    #   DB_PASS      数据库密码 (云上 MySQL, 对应 .env 的 DB_PASS)
    #   DB_USER      数据库用户名 (默认 dev_user, 对应 .env 的 DB_USER)
    #   JWT_SECRET   JWT 签名密钥
    #   APP_DIR      可选, 服务器上项目目录, 默认 /opt/CaiGouPetService
    # ------------------------------------------------------------------
    env:
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_USER: ${{ secrets.DB_USER }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_DIR: ${{ secrets.APP_DIR || '/opt/CaiGouPetService' }}

    steps:
      - name: 下载 Docker 镜像
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ${{ env.APP_DIR }}

      - name: 拉取最新代码
        # 需要 docker-compose.yml 和 .env.example 等文件
        run: |
          if [ ! -d "$APP_DIR/.git" ]; then
            echo "首次部署: 克隆仓库"
            mkdir -p "$(dirname "$APP_DIR")"
            git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
          fi
          cd "$APP_DIR"
          git fetch --prune origin
          git checkout "${{ github.ref_name }}"
          git pull --ff-only origin "${{ github.ref_name }}"

      - name: 加载 Docker 镜像并启动服务
        run: |
          set -e
          echo "=========================================="
          echo "开始部署: $APP_DIR (${{ github.ref_name }}@${{ github.sha }})"
          echo "=========================================="

          cd "$APP_DIR"

          # 加载 CI 构建好的 Docker 镜像
          if [ -f caigou-pet-service.tar.gz ]; then
            echo "加载 Docker 镜像..."
            gunzip -c caigou-pet-service.tar.gz | docker load
            rm -f caigou-pet-service.tar.gz
          else
            echo "未找到镜像 tar 文件, 将使用本地构建"
          fi

          # 创建 .env (来自仓库 .env.example; 真实密钥由 GitHub Secrets 注入)
          if [ -f .env.example ]; then
            cp .env.example .env 2>/dev/null || true
          fi
          # 覆写敏感密钥
          if [ -f .env ]; then
            grep -v '^DB_PASS=' .env > .env.tmp || true
            grep -v '^DB_USER=' .env.tmp > .env.tmp2 || true
            echo "DB_PASS=\"${DB_PASS}\"" >> .env.tmp2
            echo "DB_USER=\"${DB_USER}\"" >> .env.tmp2
            grep -v '^JWT_SECRET=' .env.tmp2 > .env.tmp3
            echo "JWT_SECRET=\"${JWT_SECRET}\"" >> .env.tmp3
            mv .env.tmp3 .env
          else
            echo "DB_PASS=\"${DB_PASS}\"" > .env
            echo "DB_USER=\"${DB_USER}\"" >> .env
            echo "JWT_SECRET=\"${JWT_SECRET}\"" >> .env
          fi

          # 使用 docker-compose.yml 启动服务
          # 注意: 使用本地已加载的镜像, 不从远程拉取
          docker compose down --remove-orphans
          docker compose up -d --force-recreate

          # 清理悬空镜像
          docker image prune -f >/dev/null 2>&1 || true

          # 健康检查
          echo "等待服务启动..."
          for i in $(seq 1 12); do
            sleep 5
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://localhost:${{ vars.APP_PORT || '3000' }}/actuator/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "部署成功: 健康检查通过 (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "  尝试 $i/12: HTTP $HTTP_CODE"
          done

          echo "警告: 健康检查超时, 请查看容器日志: docker compose logs"
          exit 1

  # ===========================================================================
  # 任务 3: 部署结果通知
  # ===========================================================================
  notify:
    name: 部署结果通知
    runs-on: ubuntu-22.04
    needs: deploy
    if: always() && needs.deploy.result != 'skipped'

    steps:
      - name: 打印部署状态
        run: |
          echo "部署状态: ${{ needs.deploy.result }}"
          echo "详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"