# =============================================================================
# CaiGouPetService — GitHub Actions CI/CD 工作流
#
# 触发方式:
#   - push 到 main / master        → 完整 CI（GitHub 托管 runner 编译打包）+ 部署（自托管 runner 执行）
#   - pull_request 到 main / master → 仅 CI（编译）
#
# 部署原理:
#   CI 在 GitHub 托管 runner 上编译代码并打包成 JAR, 上传为 artifact.
#   自托管 runner 在云服务器本地下载 JAR, 直接 java -jar 启动.
#   无需 Docker 构建, 不受镜像拉取慢的限制.
#
# 前置条件 (云服务器上执行一次):
#   1. 安装 Java 21 JRE
#   2. 安装 git（已装好）
#   3. 创建 /opt/CaiGouPetService 目录并授权给 runner 用户（已做）
#   4. 在 GitHub Secrets 中配置 DB_PASS / JWT_SECRET
# =============================================================================

name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 支持在 Actions 页面手动触发部署
  workflow_dispatch:

jobs:
  # ===========================================================================
  # 任务 1: CI — 编译打包 (PR 与 push 都会执行)
  # ===========================================================================
  ci:
    name: CI — 编译打包
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21（Temurin）
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 编译打包（跳过测试）
        # CI 环境无 MySQL 数据库可连, 只编译打包
        # 集成测试在本地开发环境运行, 部署后靠 /actuator/health 验证
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: 上传 JAR 包为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          # 只保留最近一次构建的 JAR, 避免磁盘占用
          retention-days: 1

  # ===========================================================================
  # 任务 2: 部署 — 云服务器自托管 runner 执行, 依赖 CI 先通过
  # ===========================================================================
  deploy:
    name: 部署到云服务器
    runs-on: self-hosted
    needs: ci
    # 分支级 push 或手动触发才部署, PR 不部署
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    # 所需 GitHub Secrets:
    #   DB_PASS      数据库密码 (云上 MySQL, 对应 .env 的 DB_PASS)
    #   JWT_SECRET   JWT 签名密钥
    #   APP_DIR      可选, 服务器上项目目录, 默认 /opt/CaiGouPetService
    # ------------------------------------------------------------------
    env:
      DB_PASS: ${{ secrets.DB_PASS }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_DIR: ${{ secrets.APP_DIR || '/opt/CaiGouPetService' }}

    steps:
      # 从 GitHub Actions 下载之前 CI 构建好的 JAR 包
      - name: 下载 JAR 包
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ${{ env.APP_DIR }}

      - name: 停止旧服务并启动新服务
        run: |
          set -e
          echo "=========================================="
          echo "开始部署: $APP_DIR (${{ github.ref_name }}@${{ github.sha }})"
          echo "=========================================="

          cd "$APP_DIR"

          # 确保数据目录存在
          mkdir -p uploads logs

          # 创建 .env (来自仓库 .env.example; 真实密钥由 GitHub Secrets 注入)
          # 先拉取 .env.example 文件（从仓库下载或从该目录读取）
          if [ -f "$APP_DIR/.env.example" ]; then
            echo "从本地 .env.example 生成 .env"
            cp .env.example .env 2>/dev/null || true
          else
            # 如果本地没有（首次部署可能没有 git clone），先 clone 一次
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "首次部署: 克隆仓库获取 .env.example"
              git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR" 2>/dev/null || true
              cd "$APP_DIR"
            fi
            if [ -f .env.example ]; then
              cp .env.example .env 2>/dev/null || true
            fi
          fi

          # 覆写敏感密钥: 先删除旧行再追加
          if [ -f .env ]; then
            grep -v '^DB_PASS=' .env > .env.tmp || true
            echo "DB_PASS=\"${DB_PASS}\"" >> .env.tmp
            grep -v '^JWT_SECRET=' .env.tmp > .env.tmp2
            echo "JWT_SECRET=\"${JWT_SECRET}\"" >> .env.tmp2
            mv .env.tmp2 .env
          else
            echo "DB_PASS=\"${DB_PASS}\"" > .env
            echo "JWT_SECRET=\"${JWT_SECRET}\"" >> .env
          fi

          # 加载 .env 到环境变量
          set -a
          source .env
          set +a

          # 查找旧的 Java 进程并停止
          OLD_PID=$(pgrep -f "caiGouPetService" 2>/dev/null || true)
          if [ -n "$OLD_PID" ]; then
            echo "停止旧服务 (PID: $OLD_PID)"
            kill "$OLD_PID" 2>/dev/null || true
            # 等待进程退出（最多 10 秒）
            for i in $(seq 1 10); do
              if ! kill -0 "$OLD_PID" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            # 强制终止
            kill -9 "$OLD_PID" 2>/dev/null || true
          fi

          # 找到下载的 JAR 文件
          JAR_FILE=$(ls -t *.jar 2>/dev/null | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "错误: 未找到 JAR 文件"
            exit 1
          fi
          echo "找到 JAR 文件: $JAR_FILE"

          # 启动新服务(后台运行, 输出日志到 logs/ 目录)
          nohup java -jar "$JAR_FILE" \
            --server.port=3000 \
            > "$APP_DIR/logs/application.log" 2>&1 &
          NEW_PID=$!
          echo "新服务已启动 (PID: $NEW_PID)"

          # 健康检查: 等待服务启动
          echo "等待服务启动..."
          for i in $(seq 1 12); do
            sleep 5
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://localhost:3000/actuator/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "部署成功: 健康检查通过 (HTTP $HTTP_CODE, PID: $NEW_PID)"
              exit 0
            fi
            echo "  尝试 $i/12: HTTP $HTTP_CODE"
          done

          echo "警告: 健康检查超时, 请查看日志: tail -f $APP_DIR/logs/application.log"
          exit 1

  # ===========================================================================
  # 任务 3: 部署结果通知
  # ===========================================================================
  notify:
    name: 部署结果通知
    runs-on: ubuntu-22.04
    needs: deploy
    if: always() && needs.deploy.result != 'skipped'

    steps:
      - name: 打印部署状态
        run: |
          echo "部署状态: ${{ needs.deploy.result }}"
          echo "详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"