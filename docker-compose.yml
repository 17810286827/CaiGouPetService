services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: caigou-pet-service:latest
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      DB_URL: ${DB_URL:-jdbc:mysql://47.94.240.159:3306/caigoupet?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:?DB_PASS must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      UPLOAD_DIR: /app/uploads
      LOG_PATH: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
